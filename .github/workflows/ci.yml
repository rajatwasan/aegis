name: ci

on:
  push:
    branches: [main]
  pull_request:

# One Foundry version for every job and for local development (SPEC.md D10):
# forge fmt output differs across versions, and an unpinned toolchain is why
# the contracts job went red in July without any code change.
env:
  FOUNDRY_VERSION: v1.5.1

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene (AGENTS.md R1, R3, R43, R48)
        run: bash scripts/check_hygiene.sh
      - name: deploy/start.sh refuses a silent anvil fallback
        run: bash scripts/tests/test_start_fallback.sh

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Format check
        run: forge fmt --check
        working-directory: contracts
      - name: Tests (unit, fuzz, invariant)
        run: forge test -vvv
        working-directory: contracts

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e python/
      - name: Build contracts (artifacts for the python client)
        run: forge build
        working-directory: contracts
      - name: Lint
        run: |
          ruff check python/
          ruff format --check python/
      - name: Tests with coverage
        run: pytest python/tests -q --cov=aegis --cov-branch --cov-report=json:coverage.json
      - name: Coverage floors (AGENTS.md R26)
        run: python scripts/check_coverage.py coverage.json
      - name: Adversarial evals (bypass rate must be 0)
        run: python -m aegis.evals_harness
      - name: Headless end-to-end demo
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.lock
          .venv/bin/pip install -q -e python/
          bash scripts/demo.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

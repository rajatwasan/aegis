# Optional convenience: run the hosted image locally. Nothing in tests or the
# demo requires docker; anvil and uvicorn are spawned directly by fixtures and
# scripts. Without AEGIS_RPC_URL and AEGIS_DEPLOYER_KEY in .env, start.sh runs
# an anvil inside the container and deploys there (a disposable local chain).
# Configuration comes from a local .env (copy .env.example and fill it in);
# nothing secret lives in this file.
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      AEGIS_API_HOST: 0.0.0.0
      AEGIS_API_PORT: "8080"
      AEGIS_STATE_DIR: /data/aegis
    ports:
      - "8080:8080"
    volumes:
      - aegis_data:/data

volumes:
  aegis_data:

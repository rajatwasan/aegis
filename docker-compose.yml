# Optional convenience for running the local stack. Nothing in tests or the
# demo requires docker; anvil and uvicorn are spawned directly by fixtures.
services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "8545:8545"

  approval:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.lock .
        RUN pip install -r requirements.lock
        COPY python/ python/
        RUN pip install -e python/
        CMD ["uvicorn", "aegis.approval.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      AEGIS_RPC_URL: http://anvil:8545
    depends_on:
      - anvil

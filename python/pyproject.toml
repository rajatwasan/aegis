[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.1.0"
description = "Cryptographically enforced human-in-the-loop runtime for AI agents on tokenized assets"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph",
    "langchain-core",
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "web3>=7",
    "eth-account",
    "PyYAML",
    "cryptography",
    "httpx",
    "mcp",
    "webauthn",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

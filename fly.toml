# fly.toml app configuration file generated for aegis-guardian-dawn on 2026-07-24T20:10:07-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aegis-guardian-dawn'
primary_region = 'sjc'

[build]
  dockerfile = 'deploy/Dockerfile'

[env]
  AEGIS_API_HOST = '0.0.0.0'
  AEGIS_API_PORT = '8080'
  AEGIS_STATE_DIR = '/data/aegis'
  # WebAuthn relying party = the domain the PAGE is served from (Vercel),
  # not this API domain. Not secrets — all three are public.
  AEGIS_CORS_ORIGINS = 'https://aegis-livid-zeta.vercel.app,https://aegis-rajatwasans-projects.vercel.app'
  AEGIS_RP_ID = 'aegis-livid-zeta.vercel.app'
  AEGIS_EXPECTED_ORIGIN = 'https://aegis-livid-zeta.vercel.app'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  memory_mb = 1024

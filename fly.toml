# Fly.io machine configuration for the Guardian Console API.
#
# Deploy with an explicit app name:  fly deploy --app <app-name>
# Secrets (RPC url, deployer key, guardian key, CORS origins) are set with
# `fly secrets set`, never here. See deploy/DEPLOY.md.

primary_region = 'sjc'

[build]
  dockerfile = 'deploy/Dockerfile'

[env]
  AEGIS_API_HOST = '0.0.0.0'
  AEGIS_API_PORT = '8080'
  AEGIS_STATE_DIR = '/data/aegis'

[mounts]
  source = 'aegis_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # a cold start would replay the deploy step; keep one machine warm
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  memory_mb = 1024

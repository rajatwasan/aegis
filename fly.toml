# Fly configuration for the Guardian Console API (deploy/DEPLOY.md).
#
# Secrets (`fly secrets set`): AEGIS_GUARDIAN_KEY, AEGIS_DEPLOYER_KEY,
# AEGIS_RPC_URL, AEGIS_CORS_ORIGINS, AEGIS_RP_ID, AEGIS_EXPECTED_ORIGIN.
# Nothing deployment specific (origins, URLs, keys) lives in this file.

app = 'aegis-guardian-dawn'
primary_region = 'sjc'

[build]
  dockerfile = 'deploy/Dockerfile'

[env]
  AEGIS_API_HOST = '0.0.0.0'
  AEGIS_API_PORT = '8080'
  AEGIS_STATE_DIR = '/data/aegis'
  # The demo policy (allowlist = anvil accounts). A deployment anything real
  # depends on ships its own file and names it here; there is no default.
  AEGIS_POLICY_PATH = 'policies/dev.yaml'

# The state directory holds the audit log, approvers and the deployment
# record; without a volume a restart is a fresh world.
[mounts]
  source = 'aegis_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  memory_mb = 1024
